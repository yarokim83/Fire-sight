<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/fire-sight-icon.png?v=5" />
  <link rel="manifest" href="/manifest.json" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FireSight" />
  <link rel="apple-touch-icon" href="/fire-sight-icon.png?v=5" />
  
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>Fire-Sight: 소방시설관리사</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body style="background-color: #0f172a; margin: 0; padding: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('FireSight SW 등록 완료: ', registration);
          })
          .catch(registrationError => {
            console.log('SW 등록 실패: ', registrationError);
          });
      });
    }
  </script>
</body>
</html>
