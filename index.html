<html lang="ko"> <head>
  <meta charset="UTF-8" />

  <title>Fire-Sight: 소방시설관리사</title>
</head>

<body style="background-color: #0f172a;"> <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <script>
    // 서비스 워커 등록 (오프라인 캐싱 및 앱 작동 지원)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('FireSight SW 등록 완료: ', registration);
          })
          .catch(registrationError => {
            console.log('SW 등록 실패: ', registrationError);
          });
      });
    }
  </script>
</body>

</html>
